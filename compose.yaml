services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yiji
      POSTGRES_USER: yiji
      POSTGRES_PASSWORD: yiji_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yiji -d yiji"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - yiji_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - yiji_redis:/data

volumes:
  yiji_postgres:
  yiji_redis:
