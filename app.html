<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176d5c">
<title>医记</title>
<style>
:root{--bg:#efe7d9;--paper:#fffaf2;--card:#fffdf8;--ink:#142b25;--muted:#776f64;--line:#e6dac8;--brand:#176d5c;--brand2:#0f5448;--soft:#e8f5ef;--warn:#fff5dd;--danger:#c34a42;--shadow:0 14px 40px rgba(42,57,48,.10)}
*{box-sizing:border-box}html{background:#dce5df}body{margin:0;background:#dce5df;color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.phone{width:min(100vw,393px);min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 20px 70px rgba(17,45,38,.18);position:relative;overflow:hidden}.content{padding:18px 14px 112px}.page{display:none}.page.active{display:block}.page>*+*{margin-top:18px}.head{padding:8px 2px 16px}.head small{display:block;color:var(--muted);margin-bottom:5px}.head h1{margin:0;font-size:25px;line-height:1.15;letter-spacing:-.03em}.head p{margin:7px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.hidden{display:none!important}.primary{border:0;background:var(--brand);color:white;border-radius:16px;padding:13px 16px;font-weight:800}.ghost{border:1px solid var(--line);background:#fffdf8;border-radius:16px;padding:11px 14px;font-weight:700}.link{border:0;background:transparent;color:var(--brand);font-weight:800}.danger{border:1px solid #efc7c3;background:#fff7f6;color:var(--danger);border-radius:16px;padding:11px 14px;font-weight:800}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px}.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--brand);font-size:12px}.warn{padding:12px;border:1px solid #ecd3a0;border-radius:16px;background:var(--warn);color:#66542d}.icon-btn{display:grid;place-items:center;border:1px solid var(--line);background:#fffdf8;border-radius:14px;width:42px;height:42px;padding:0;font-size:22px;font-weight:900;line-height:1}.icon-btn svg{width:20px;height:20px;display:block}.headbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.choice{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);border-radius:18px;background:#fff;padding:14px;text-align:left;font-weight:800}.choice small{display:block;color:var(--muted);font-weight:500}.search-sheet{display:grid;gap:12px}.pill-row{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:var(--muted)}.pill.active{background:var(--brand);border-color:var(--brand);color:white}.dotmark{width:8px;height:8px;margin:13px 14px 0 0;border-radius:50%;background:var(--brand);flex:0 0 auto}
.login{position:fixed;inset:0;z-index:80;display:grid;place-items:end center;background:rgba(20,43,37,.42);padding:0}.login.hidden{display:none}.login-panel{width:min(100vw,430px);padding:22px 18px 26px;border-radius:26px 26px 0 0;background:var(--paper)}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:#5d655f;font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:12px;outline:0}.field textarea{min-height:92px;resize:vertical}.check{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;margin-top:14px}.actions button{flex:1}
.hero{padding:24px 22px;background:linear-gradient(145deg,#15725f,#0f4f43);color:white}.hero p{margin:8px 0 20px;color:#d5eee7}.hero .light{width:100%;border:0;border-radius:17px;background:white;color:var(--brand2);padding:14px;font-weight:900}.quick{padding:15px}.quick .row{align-items:flex-start}.quick h3{margin:0 0 3px;font-size:17px}.simple-list{padding:18px}.simple-list h3{margin:0 0 12px}.item{display:flex;gap:11px;padding:13px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}.ico{display:grid;place-items:center;flex:0 0 auto;width:36px;height:36px;border-radius:13px;background:var(--soft);color:var(--brand);font-weight:900}.item b,.item small{display:block}.item small{color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.search{grid-column:1/-1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:10px 12px}.search input{width:100%;border:0;outline:0;background:transparent}.toolbar select{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:10px}
.record{padding:15px}.record h3{margin:8px 0 5px;font-size:17px;word-break:break-word}.record p{margin:0;color:var(--muted)}.record-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.record-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:13px}.record-actions button{min-width:0;padding:8px 4px;border-radius:13px;font-size:12px;white-space:nowrap}.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.timeline{padding:6px 0;overflow:hidden}.event{position:relative;display:grid;grid-template-columns:46px 16px minmax(0,1fr);gap:7px;padding:9px 0 18px}.event:not(:last-child):after{content:"";position:absolute;left:53px;top:31px;bottom:-4px;width:1px;background:var(--line)}.event time{font-size:11px;color:var(--muted);word-break:break-word}.dot{z-index:1;width:11px;height:11px;margin-top:5px;border:3px solid #fff;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px #9fd4c7}.event h4{margin:0 0 3px;word-break:break-word}.event p{margin:0;color:var(--muted);font-size:13px;word-break:break-word}
.sheet{position:fixed;inset:0;z-index:70;display:none;align-items:end;background:rgba(20,43,37,.45)}.sheet.open{display:flex}.sheet-panel{width:min(100vw,393px);max-height:92vh;overflow:auto;margin:0 auto;background:var(--paper);border-radius:26px 26px 0 0;padding:18px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sheet-head h2{margin:0;font-size:20px}.x{display:grid;place-items:center;border:0;background:#efe9df;border-radius:12px;width:38px;height:38px;padding:0;font-size:24px;line-height:1}.upload-box{border:1px dashed #9cb9af;border-radius:18px;background:#fbf8f0;text-align:center;padding:24px 12px}.upload-box .big{font-size:34px}
.ocr-table{display:grid;gap:8px}.ocr-row{padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}.ocr-row b,.ocr-row small{display:block}.ocr-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.ocr-summary div{padding:10px;border-radius:14px;background:var(--soft);color:var(--brand);font-weight:900;text-align:center}.keyword-list{display:flex;flex-wrap:wrap;gap:7px}.keyword{border:1px solid #cfe0d9;background:#f4fbf8;border-radius:999px;padding:7px 10px;color:var(--brand);font-weight:800}.form-section{padding:13px 0;border-top:1px solid var(--line)}.form-section:first-of-type{border-top:0;padding-top:0}.form-section h4{margin:0 0 10px;font-size:17px}.form-section .hint{margin:-5px 0 10px;color:var(--muted);font-size:13px}.field textarea.tall{min-height:118px}
.file-strip{display:flex;gap:8px;overflow:auto;padding:2px 0 4px}.file-chip{flex:0 0 auto;max-width:142px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;text-align:left;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-add{flex:0 0 auto;width:44px;height:44px;border:1px dashed #9cb9af;border-radius:16px;background:#f4fbf8;color:var(--brand);font-size:24px;font-weight:900}
.pack-preview{padding:16px}.pack-preview h3{margin:0 0 8px}.step-note{padding:10px 12px;border-radius:14px;background:var(--soft);color:var(--brand);font-weight:800}.section{padding-top:13px;margin-top:13px;border-top:1px solid var(--line)}.section h4{margin:0 0 6px}.section ul{margin:0;padding-left:20px;color:#4f5c56}.privacy-grid{display:grid;gap:10px}.privacy{padding:15px}.privacy h3{margin:0 0 6px}
.bottom{position:fixed;left:50%;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(3,1fr);width:min(100vw,393px);transform:translateX(-50%);padding:7px 4px calc(7px + env(safe-area-inset-bottom));border-top:1px solid #e1d6c6;background:rgba(255,252,246,.96);backdrop-filter:blur(16px)}.bottom button{border:0;background:transparent;color:#6f675c;font-size:13px;font-weight:900;padding:6px 0}.bottom i{display:block;font-style:normal;font-size:24px;line-height:1.05;margin-bottom:2px}.bottom button.active{color:var(--brand);font-weight:1000}.floating{position:fixed;left:50%;bottom:66px;z-index:49;width:min(calc(100vw - 28px),365px);transform:translateX(-50%);transition:.2s}.floating.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}.floating button{width:100%;box-shadow:0 14px 28px rgba(23,109,92,.22)}
@media(min-width:394px){.login-panel,.sheet-panel{border-radius:26px;margin-bottom:0}}
</style>
</head>
<body>
<main class="phone">
  <div class="content">
    <section class="page" id="home"></section>
    <section class="page active" id="records"></section>
    <section class="page" id="timeline"></section>
    <section class="page" id="pack"></section>
    <section class="page" id="todos"></section>
    <section class="page" id="settings"></section>
  </div>
  <div class="floating"><button class="primary" id="mainUpload">上传病历资料</button></div>
  <nav class="bottom" id="nav"></nav>
</main>

<div class="login" id="login">
  <div class="login-panel">
    <h2 style="margin:0 0 6px">登录医记</h2>
    <p class="muted" style="margin:0 0 12px">用邮箱验证码登录。你的资料只保存在你的账户下。</p>
    <div class="field"><label>邮箱</label><input id="email" type="email" placeholder="请输入邮箱"></div>
    <div class="field"><label>验证码</label><input id="code" inputmode="numeric" placeholder="邮箱收到的验证码"></div>
    <label class="check"><input id="agree" type="checkbox"> <span>我已阅读并同意 <a href="/terms.html" target="_blank">服务协议</a> 和 <a href="/privacy.html" target="_blank">隐私政策</a></span></label>
    <div class="actions"><button class="ghost" id="sendCode">获取验证码</button><button class="primary" id="loginBtn">登录</button></div>
    <button class="link" id="clearLogin" style="margin-top:10px">清除本机登录</button>
    <p class="muted" id="loginStatus"></p>
  </div>
</div>

<div class="sheet" id="sheet"><div class="sheet-panel"><div class="sheet-head"><h2 id="sheetTitle">操作</h2><button class="x" id="closeSheet">×</button></div><div id="sheetBody"></div></div></div>
<div id="toast" style="position:fixed;left:50%;bottom:128px;z-index:90;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;padding:10px 14px;border-radius:999px;background:#173e35;color:white;max-width:360px;text-align:center"></div>

<script>
const API=localStorage.getItem('yiji.apiBase')||(location.protocol==='file:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'?'https://yijijiankang.cn/v1':'/v1');
const TOKEN_KEY='yiji.real.token';
const PROFILE_KEY='yiji.profile.local';
const OCR_TEST_KEY='yiji.ocr.tests';
let token=localStorage.getItem(TOKEN_KEY)||'', records=[], todos=[], timelineItems=[], timelineLoaded=false, currentPage='records', pendingUpload=null, currentPackId='', currentShare=null, timelineFilter='', profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{"avatar":"我","name":"本人","desc":"当前正在整理我的病历"}');
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text){const t=$('#toast');t.textContent=text;t.style.opacity='1';t.style.transform='translateX(-50%)';clearTimeout(window.__toast);window.__toast=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)'},2300)}
function saveProfile(){localStorage.setItem(PROFILE_KEY,JSON.stringify(profile))}
function getOcrTests(){return JSON.parse(localStorage.getItem(OCR_TEST_KEY)||'[]')}
function saveOcrTests(rows){localStorage.setItem(OCR_TEST_KEY,JSON.stringify(rows))}
function authHeaders(extra={}){return token?{...extra,Authorization:`Bearer ${token}`}:{...extra}}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:authHeaders(opt.headers||{})});const text=await r.text();let body=null;try{body=text?JSON.parse(text):null}catch{body={message:text}}if(!r.ok)throw new Error(body?.message||body?.error?.message||body?.error||text||`HTTP ${r.status}`);return body}
async function apiJson(path,body,method='POST'){return api(path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
function absoluteApiUrl(path){return `${API.startsWith('http')?API:location.origin+API}${path}`}
function reportClientError(type,message,userAction=''){fetch(`${API}/monitoring/client-error`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,message:String(message||'').slice(0,600),page:location.pathname||'app.html',userAction})}).catch(()=>{})}
window.addEventListener('error',e=>reportClientError('window_error',e.message,'browser'));
window.addEventListener('unhandledrejection',e=>reportClientError('promise_rejection',e.reason?.message||e.reason,'browser'));
function showLogin(){ $('#login').classList.remove('hidden') } function hideLogin(){ $('#login').classList.add('hidden') }
function requireLogin(){if(!token){showLogin();throw new Error('请先登录')}}
function openSheet(title,html){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#sheet').classList.add('open')}
function closeSheet(){pendingUpload=null;$('#sheet').classList.remove('open')}

const tabs=[['records','📁','病历'],['todos','✓','待办'],['settings','👤','我的']];
function renderNav(){ $('#nav').innerHTML=tabs.map(([id,ico,label])=>`<button class="${(id===currentPage||(['home','timeline'].includes(currentPage)&&id==='records')||(currentPage==='pack'&&id==='todos'))?'active':''}" data-page="${id}"><i>${ico}</i>${label}</button>`).join(''); $$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(page){currentPage=page;$$('.page').forEach(p=>p.classList.toggle('active',p.id===page));$('#mainUpload').parentElement.classList.add('hidden');renderNav();renderPage()}

async function sendCode(){if(!$('#agree').checked)throw new Error('请先同意服务协议和隐私政策');const email=$('#email').value.trim();if(!email)throw new Error('请输入邮箱');const r=await apiJson('/auth/email/send',{email});if(r.mockCode)$('#code').value=r.mockCode;toast('验证码已发送')}
async function login(){if(!$('#agree').checked)throw new Error('请先同意服务协议和隐私政策');const r=await apiJson('/auth/email/verify',{email:$('#email').value.trim(),code:$('#code').value.trim(),deviceId:'app-html'});token=r.accessToken;localStorage.setItem(TOKEN_KEY,token);hideLogin();await refresh();toast('登录成功')}
async function ensureProfileIfNeeded(error){if(!String(error.message).includes('本人健康档案'))throw error;await apiJson('/onboarding/profile',{displayName:'我',gender:'未填写',healthConcerns:['整理病历'],allergyNote:'未填写',chronicDiseaseNote:'未填写'});return refresh()}
async function refresh(){if(!token){timelineItems=[];timelineLoaded=false;renderPage();showLogin();return}try{const [recordRows,todoRows,timeline]=await Promise.all([api('/records'),api('/todos'),api('/records/timeline')]);records=recordRows;todos=todoRows;timelineItems=timeline?.items||[];timelineLoaded=true;hideLogin();renderPage()}catch(e){await ensureProfileIfNeeded(e).catch(err=>{showLogin();$('#loginStatus').textContent=err.message})}}
async function refreshAgentTodos(){if(!token)return;try{await apiJson('/agent/todos/refresh',{});todos=await api('/todos')}catch(e){reportClientError('agent_todos_refresh_failed',e.message,'refresh agent todos')}}

function cleanValue(v){const s=String(v||'').trim();return ['未记录','未分类','无'].includes(s)?'':s}
function recordDate(r){return String(r.visitDate||'').slice(0,10)}
function sortDate(r){return String(r.visitDate||r.createdAt||'').slice(0,10)}
function categoryOf(r){return cleanValue(String(r.healthConcern||'').split('｜')[0])}
function noteOf(r){return cleanValue(String(r.healthConcern||'').split('｜').slice(1).join('｜'))}
function institutionOf(r){return cleanValue(r.institution)}
function filesOf(r){return r.files||[]}
function fileOf(r){return r.files?.[0]}
function statusText(s){return {PENDING_REVIEW:'待核对',ARCHIVED:'已归档'}[s]||s||''}
function metaText(...parts){return parts.filter(Boolean).join(' · ')}
function concernText(cat,note){return cat||note?[cat,note].join('｜'):undefined}

function renderPage(){renderNav();$('#mainUpload').parentElement.classList.add('hidden'); if(currentPage==='home')renderHome(); if(currentPage==='records')renderRecords(); if(currentPage==='timeline')renderTimeline(); if(currentPage==='pack')renderPack(); if(currentPage==='todos')renderTodos(); if(currentPage==='settings')renderSettings()}
function renderHome(){
  go('records');
}
function looksBadTitle(value){const s=String(value||'').trim();return !s||/^[a-f0-9]{16,}$/i.test(s)||/^[0-9a-f-]{24,}$/i.test(s)||/^IMG_|^DSC_|^\d{8,}/i.test(s)}
function hasImageEvidence(text){return /(CT|MRI|DR|X光|X线|B超|超声|影像号|放射|片号|片子|影像检查|影像诊断|影像表现)/i.test(String(text||''))}
function recordTypeLabel(type,rawText=''){const label={OTHER:'其他',CHECK_REPORT:'检查报告',OUTPATIENT_RECORD:'门诊记录',PRESCRIPTION:'处方',IMAGE:'影像资料',INPATIENT_RECORD:'住院资料',PHYSICAL_EXAM:'体检报告'}[type]||type||'';return label==='影像资料'&&!hasImageEvidence(rawText)?'其他':label}
function suggestedTitleFromRecord(r){return suggestedTitle({title:r.title,recordType:r.recordType,category:categoryOf(r),institution:institutionOf(r),date:recordDate(r),rawText:latestTask(r)?.rawText})}
function suggestedTitle({title='',recordType='',category='',institution='',date='',rawText=''}={}){
  if(!looksBadTitle(title))return cleanValue(title);
  const text=String([category,institution,rawText].join(' '));
  const inferred=/牙|口腔|齿|龋|根管|洁牙/.test(text)?'牙科':/胃|肠|腹|消化|胃镜|肠镜/.test(text)?'胃肠':/体检|血常规|尿常规|肝功能|肾功能/.test(text)?'体检':category||'就医';
  const type=recordTypeLabel(recordType,rawText);
  return `${inferred}${type&&type!=='其他'?type:'病历资料'}${date?`（${date}）`:''}`;
}
function recordMetaLine(r){return metaText(recordDate(r)||'时间待补充',recordTypeLabel(r.recordType,latestTask(r)?.rawText)||'资料',categoryOf(r),institutionOf(r))}
function recordNeedsInfo(r){return !recordDate(r)||!categoryOf(r)||!institutionOf(r)}
function timelineCategoryOf(item){return cleanValue(String(item.healthConcern||'').split('｜')[0])}
function recordForTimeline(item){return records.find(r=>r.id===(item.recordIds?.[0]||item.id))}
function timelineSource(){return timelineLoaded?timelineItems:records.map(r=>({id:r.id,date:recordDate(r)||sortDate(r),happened:suggestedTitleFromRecord(r),healthConcern:r.healthConcern,recordType:r.recordType,institution:r.institution,recordIds:[r.id],fileCount:filesOf(r).length,canAddToVisitPack:true}))}
function timelineMetaLine(item){
  const record=recordForTimeline(item);
  return record?recordMetaLine(record):metaText(item.date||'时间待补充',recordTypeLabel(item.recordType)||'资料',timelineCategoryOf(item),cleanValue(item.institution),item.fileCount?`${item.fileCount} 份原件`:'');
}
function timelineActions(item){
  const record=recordForTimeline(item);
  if(record)return recordMiniActions(record);
  const id=item.recordIds?.[0]||item.id,inPack=packSet.has(id);
  return item.canAddToVisitPack?`<button class="${inPack?'primary':'ghost'}" data-pack="${esc(id)}">${inPack?'已加入':'加入包'}</button>`:'';
}
function timelineHtml(limit=4,cat=''){
  const data=timelineSource().filter(item=>!cat||timelineCategoryOf(item)===cat).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,limit);
  return data.map(item=>{const record=recordForTimeline(item),note=record?noteOf(record):'',title=record?suggestedTitleFromRecord(record):cleanValue(item.happened)||'就医记录';return `<div class="event"><time>${esc(item.date||'补时间')}</time><span class="dot"></span><div><h4>${esc(title)}</h4><p>${esc(timelineMetaLine(item))}</p>${record&&looksBadTitle(record.title)?'<p class="muted">原文件名识别不清，已先生成一个可读标题，请在编辑里确认。</p>':''}${note?`<p>${esc(note)}</p>`:''}<div class="record-actions">${timelineActions(item)}</div></div></div>`}).join('')||`<div class="empty">${cat?'这个分类下还没有资料':'还没有资料，点击上方添加。'}</div>`;
}
function recordMiniActions(r){const f=fileOf(r),inPack=packSet.has(r.id),count=filesOf(r).length;return `${f?`<button class="ghost" data-original="${esc(r.id)}" data-file="${esc(f.id)}">原件${count>1?` ${count}`:''}</button>`:''}<button class="ghost" data-edit="${esc(r.id)}">编辑</button><button class="${inPack?'primary':'ghost'}" data-pack="${esc(r.id)}">${inPack?'已加入':'加入包'}</button><button class="danger" data-delete="${esc(r.id)}">删除</button>`}
function renderRecords(){
  const cats=[...new Set(timelineSource().map(timelineCategoryOf).filter(Boolean))];
  if(timelineFilter&&!cats.includes(timelineFilter))timelineFilter='';

function filterRecords(){

}
function previewPack(){
  const p=packContent(); if(!p.selected.length){toast('请先选择资料');return}
  $('#packPreview').style.display='block';
  $('#packPreview').innerHTML=`<h3>预览</h3><p class="muted">${esc(p.range)} · ${p.selected.length} 份资料</p>
  <div class="section"><h4>就诊目的</h4><p>${esc(p.purpose)}</p></div>
  <div class="section"><h4>近期情况</h4><p>${esc(p.recent)}</p></div>
  <div class="section"><h4>就医时间线</h4><ul>${p.selected.slice().sort((a,b)=>String(sortDate(b)).localeCompare(String(sortDate(a)))).map(r=>`<li>${esc(recordMetaLine(r))}：${esc(r.title)}</li>`).join('')}</ul></div>
  <div class="section"><h4>关键资料清单</h4><ul>${p.selected.map(r=>`<li>${esc(r.title)}${institutionOf(r)?`（${esc(institutionOf(r))}）`:''}</li>`).join('')}</ul></div>
  <div class="section"><h4>想问医生的问题</h4><p>${esc(p.questions)}</p></div>
  <div class="section"><h4>原始病历</h4><p>${p.includeOriginals?'导出时会把已选择资料的原始病历一起放进 PDF。':'本次只导出整理后的资料包，不附原始病历。'}</p></div>
  <div class="section"><p class="muted">说明：资料包只整理你上传和填写的内容，不提供诊断、治疗或用药建议。</p></div>`;
}
async function createGeneratedPack(){
  const p=packContent(); if(!p.selected.length){toast('请先选择资料');return null}
  const pack=await apiJson('/visit-packs',{title:'就诊资料包',visitReason:p.purpose,recentSymptoms:`${p.recent}\n\n原始资料：${p.includeOriginals?'附上原始病历':'不附原始病历'}`,questions:p.questions,selectedRecordIds:p.selected.map(r=>r.id),includeOriginalFiles:p.includeOriginals,attachmentMode:p.includeOriginals?'embed_pdf':'none'});
  const generated=await api(`/visit-packs/${pack.id}/generate`,{method:'POST'});
  currentPackId=generated.id;
  return generated;
}
async function exportPackPdf(){
  const generated=await createGeneratedPack(); if(!generated)return; previewPack();
  await refreshAgentTodos();
  const r=await fetch(`${API}/visit-packs/${currentPackId}/export.pdf`,{headers:authHeaders()}); if(!r.ok)throw new Error(await r.text());
  const blob=await r.blob(), url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='医记就诊资料包.pdf'; a.click(); URL.revokeObjectURL(url); toast('PDF 已导出');
}
async function createPackShare(){
  const generated=await createGeneratedPack(); if(!generated)return; previewPack();
  const expiresAt=new Date(Date.now()+7*86400000).toISOString();
  const share=await apiJson(`/visit-packs/${currentPackId}/shares`,{expiresAt});
  currentShare={id:share.id,url:absoluteApiUrl(share.sharePath),expiresAt:share.expiresAt};
  renderSharePanel(); toast('分享链接已生成');
}
function renderSharePanel(){
  const panel=$('#sharePanel'); if(!panel||!currentShare){if(panel)panel.style.display='none';return}
  panel.style.display='block';
  panel.innerHTML=`<h3>分享链接</h3><p class="muted">7 天内可打开。撤回后对方不能再看。</p><div class="field"><input id="shareUrl" readonly value="${esc(currentShare.url)}"></div><div class="actions"><button class="primary" id="copyShare">复制</button><button class="ghost" id="openShare">打开</button><button class="danger" id="revokeShare">撤回</button></div>`;
  $('#copyShare').onclick=copyShareUrl; $('#openShare').onclick=()=>window.open(currentShare.url,'_blank','noopener'); $('#revokeShare').onclick=revokePackShare;
}
async function copyShareUrl(){
  const url=currentShare?.url; if(!url)return;
  try{await navigator.clipboard.writeText(url)}catch(e){const input=$('#shareUrl');input.select();document.execCommand('copy')}
  toast('链接已复制');
}
async function revokePackShare(){
  if(!currentPackId||!currentShare)return;
  if(!confirm('确定撤回这个分享链接吗？撤回后对方不能再打开。'))return;
  await api(`/visit-packs/${currentPackId}/shares/${currentShare.id}/revoke`,{method:'POST'});
  currentShare=null; renderSharePanel(); toast('分享链接已撤回');
}
function startTodo(){requireLogin();openSheet('添加看医生提醒',`<div class="field"><label>待办类型</label><select id="tType"><option value="follow_up">复诊提醒</option><option value="record_review">资料补全</option><option value="upload_report">上传报告</option><option value="visit_pack">生成资料包</option></select></div><div class="field"><label>提醒时间</label><input id="tAt" type="datetime-local"></div><div class="field"><label>标题</label><input id="tTitle" value="看医生前整理资料"></div><button class="primary" id="saveTodo" style="width:100%">保存</button>`);$('#tAt').value=new Date(Date.now()+7*86400000-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);$('#saveTodo').onclick=async()=>{await apiJson('/todos',{type:$('#tType').value,title:$('#tTitle').value,dueAt:new Date($('#tAt').value).toISOString(),metadata:{source:'app-clean'}});closeSheet();await refresh();go('todos');toast('待办已保存')}}

$('#mainUpload').onclick=()=>startUpload().catch(e=>toast(e.message)); $('#closeSheet').onclick=closeSheet; $('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
$('#sendCode').onclick=()=>sendCode().catch(e=>toast(e.message)); $('#loginBtn').onclick=()=>login().catch(e=>toast(e.message)); $('#clearLogin').onclick=()=>{token='';localStorage.removeItem(TOKEN_KEY);showLogin()};
renderNav(); renderPage(); refresh();
</script>
</body>
</html>
